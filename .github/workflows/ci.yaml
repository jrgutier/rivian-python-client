name: Run Python Tests
on:
  push:
    branches:
      - main
      - vendor-client
  pull_request:
    branches:
      - main
      - vendor-client

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Poetry
        uses: abatilo/actions-poetry@v2
      - name: Install dependencies
        run: |
          poetry install
      - name: Run linting
        run: |
          poetry run ruff check .
          poetry run ruff format . --check
      - name: Run mypy
        run: poetry run mypy src/rivian
      # No --cov here: pytest-cov is not in pyproject.toml's dev group and is not a
      # locked package, so coverage flags would fail with "unrecognized arguments"
      # (pytest exit 4) before a single test ran. Adding the dependency also needs a
      # regenerated poetry.lock, which cannot be produced right now — the local poetry
      # is itself broken by the same removed Homebrew python@3.13 that broke the venv.
      # Client-side coverage belongs with the uv/hatchling migration in s03.
      - name: Run tests with poetry and pytest
        run: poetry run pytest
