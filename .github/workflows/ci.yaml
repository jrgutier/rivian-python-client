name: Run Python Tests
on:
  push:
    branches:
      - main
      - vendor-client
  pull_request:
    branches:
      - main
      - vendor-client

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # uv-dynamic-versioning derives the version from git tags; a shallow
          # clone yields no tags and the build fails.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Run linting
        run: |
          uv run ruff check .
          uv run ruff format . --check

      # Informational until the transport merge and the protobuf removal land.
      # 22 findings remain after excluding generated stubs, and ~19 are in code
      # those two stories delete outright: 10 in the gql/DSL path in rivian.py,
      # 8 in the hand-written proto/*.py _message.Message subclasses. Fixing them
      # now is work thrown away. Flip to blocking once both have landed.
      - name: Run mypy (informational until the transport merge)
        continue-on-error: true
        run: uv run mypy src/rivian

      # pytest-cov is a declared dev dependency now that the project builds with
      # uv, so coverage flags are safe here. They were not under poetry.
      - name: Run tests
        run: uv run pytest --cov=src/rivian --cov-report=term-missing

      # The .proto files are the source of truth. This fails if the checked-in
      # generated modules drift from them — which is how two import defects got
      # in: hand-stripped cross-imports and a missing well-known-type import.
      - name: Verify generated protobuf is in sync
        run: |
          bash scripts/regen_proto.sh
          git diff --exit-code -- src/rivian/proto/
