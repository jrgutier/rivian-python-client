name: CI
on:
  push:
    branches:
      - main
      - vendor-client
  pull_request:
    branches:
      - main
      - vendor-client

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # uv-dynamic-versioning derives the version from git tags; a shallow
          # clone has none and the build fails.
          fetch-depth: 0

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.2"

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run linting
        run: |
          uv run ruff check .
          uv run ruff format . --check

      # Informational while the Parallax write path still carries generated
      # protobuf. The remaining findings sit in proto/*.py _message.Message
      # subclasses that the hand-rolled encoder replaces. Flip to blocking once
      # protobuf is gone.
      - name: Run mypy (informational)
        continue-on-error: true
        run: uv run mypy src/rivian

      - name: Test with pytest
        run: uv run pytest --cov=src/rivian --cov-report=term-missing

      # The .proto files are the source of truth. Fails on any drift between them
      # and the checked-in generated modules -- which is how two import defects
      # got in: hand-stripped cross-imports, and a missing well-known-type import
      # that made ClimateHoldSetting unimportable on its own.
      - name: Verify generated protobuf is in sync
        run: |
          bash scripts/regen_proto.sh
          git diff --exit-code -- src/rivian/proto/
