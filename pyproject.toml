[project]
name = "rivian-python-client"
description = "Rivian API Client (Unofficial)"
authors = [
    { name = "Brian Retterer", email = "bretterer@gmail.com" },
    { name = "J.R. Gutierrez", email = "jrgutier@gmail.com" },
    { name = "Nathan Spencer", email = "natekspencer@gmail.com" },
    { name = "Trevor Mack", email = "drummer8001@gmail.com" },
]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"

# Upstream's set, plus protobuf. gql, websockets, attrs, propcache and yarl are
# gone: adopting upstream's plain-string transport removes the only importers of
# gql, and the other three are transitive through aiohttp.
#
# protobuf is the one addition, and it is temporary. Our Parallax *write* path --
# the half upstream does not have -- still builds payloads from generated *_pb2
# modules.
#
# The UPPER bound is load-bearing in both directions, and the ceiling is now
# 6.33, not 7. Generated code calls ValidateProtobufRuntimeVersion, which refuses
# to load when the gencode is NEWER than the runtime. Home Assistant pins
# protobuf==6.32.0, so a dev environment resolving 6.33.x bakes gencode 6.33 into
# the committed *_pb2 files and the vendored client then fails to import inside
# HA -- which is exactly what happened and is what this ceiling prevents.
# Removed entirely when the hand-rolled encoder replaces *_pb2.
dependencies = [
    "aiohttp (>=3.0.0)",
    "cryptography (>=41.0.1)",
    "protobuf (>=3.20.0,<6.33)",
    "backports-strenum (>=1.2.4) ; python_version < '3.11'",
    "typing_extensions (>=4.14.1) ; python_version < '3.11'",
    # Imported by rivian.py and ws_monitor.py on Python 3.10, where
    # asyncio.timeout does not yet exist. Neither this project nor upstream
    # declared it -- it resolved only because aiohttp happens to depend on it
    # below 3.11. That is luck, not a contract, and it breaks the moment aiohttp
    # drops it. Declared explicitly.
    "async-timeout (>=4.0) ; python_version < '3.11'",
]

dynamic = ["version"]

[project.optional-dependencies]
ble = [
    # Intentionally no upper bound. A `<1.0.0` cap here is what caused upstream
    # issue #230 -- Home Assistant resolved bleak 1.0.1 and the integration
    # failed to load. HA pins bleak itself, and a client ceiling tighter than
    # HA's pin re-creates exactly that failure. The dev environment is kept
    # honest by installing under HA's constraints, not by capping here.
    "bleak (>=0.21)",
    "dbus-fast (>=2.11.0) ; sys_platform == 'linux'",
]

[dependency-groups]
# Upstream's, plus two of ours: pytest-cov so CI can report coverage, and
# grpcio-tools for scripts/regen_proto.sh. ruff tracks upstream's
# .pre-commit-config rev (v0.16.1) so CI and the hook agree.
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.0,<1.5",
    "pytest-cov>=4.1.0",
    "python-dotenv>=1.0,<1.3",
    "aresponses>=3.0,<4.0",
    "mypy>=1.7,<3.0",
    "ruff>=0.16,<0.17",
    "pre-commit>=4.6.1,<5",
    "grpcio-tools>=1.76.0",
]

[tool.hatch.build.hooks.version]
path = "src/rivian/__version__.py"

[tool.hatch.build.targets.sdist]
include = ["src/rivian"]

[tool.hatch.build.targets.wheel]
include = ["src/rivian"]

[tool.hatch.build.targets.wheel.sources]
"src/rivian" = "rivian"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv]
default-groups = "all"
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true }}]

[tool.uv-dynamic-versioning]
pattern = "default-unprefixed"

[tool.mypy]
# protoc output is generated; its stubs are not ours to satisfy.
exclude = ['.*_pb2\.pyi?$']

[tool.ruff]
# protoc output is generated, never hand-edited (scripts/regen_proto.sh), and
# accounted for 251 of 349 lint findings. Linting it is meaningless.
extend-exclude = ["*_pb2.py", "*_pb2.pyi"]

[tool.ruff.lint.per-file-ignores]
# Demo and debugging scripts, not library code: broad excepts, prints and naive
# timestamps are appropriate there and linting them as if they shipped is noise.
"examples/*" = ["BLE001", "S110", "T201", "DTZ005", "EXE001"]
"decode_*.py" = ["BLE001", "S110", "T201", "DTZ005", "EXE001"]
"introspect_schemas.py" = ["BLE001", "T201", "EXE001"]
"get_vehicle_id.py" = ["BLE001", "T201", "EXE001"]
"tests/*" = ["BLE001", "S110"]

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = false

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"
